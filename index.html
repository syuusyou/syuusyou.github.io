<!DOCTYPE html>
<html lang="zh-Hant">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <!-- MANDATORY: Declare support for both light and dark themes -->
  <meta name="color-scheme" content="light dark">
  <script>
    try {
      document.querySelector('meta[name="color-scheme"]').content = localStorage.getItem("color-scheme") ?? "light dark";
    } catch (e) {}
  </script>
  <title>咻咻的心情隨筆 | 記錄生活、靈感與學習的溫暖角落</title>
  <meta name="description" content="歡迎來到咻咻的心情隨筆。這裡記錄了我的日常感悟、生活隨筆與從零開始學習架設網站的點滴。">
  
  <!-- Open Graph 社群分享標籤 (貼到 LINE / FB 時顯示的漂亮卡片) -->
  <meta property="og:title" content="咻咻的心情隨筆">
  <meta property="og:description" content="記錄生活、靈感與學習點滴的個人部落格。">
  <meta property="og:type" content="website">

  <link rel="stylesheet" href="style.css">
</head>
<body>
  <header class="site-header">
    <div class="container header-inner">
      <a href="#" class="brand" id="home-link">
        <span class="brand-logo" aria-hidden="true">✦</span>
        <div>
          <span class="brand-title">咻咻的心情隨筆</span>
          <span class="brand-subtitle">HsiuHsiu's Notes &amp; Journal</span>
        </div>
      </a>

      <nav class="site-nav" aria-label="主要導覽">
        <a href="index.html" class="nav-link active" aria-current="page">所有文章</a>
        <a href="about.html" class="nav-link">關於咻咻</a>
        <button type="button" id="theme-toggle" class="theme-toggle" aria-label="切換深淺色閱讀模式" title="切換深淺色主題">
          <span class="theme-icon-light" aria-hidden="true">☀️</span>
          <span class="theme-icon-dark" aria-hidden="true">🌙</span>
          <span class="theme-label">閱讀模式</span>
        </button>
      </nav>
    </div>
  </header>

  <main class="container main-content">
    <!-- 首頁主打區 (Hero Section) -->
    <section class="hero" id="hero-section">
      <div class="hero-badge">✨ 歡迎來到我的小天地</div>
      <h1 class="hero-title">把每個平凡的日子，<br>寫成值得回味的故事。</h1>
      <p class="hero-desc">
        嗨，我是咻咻！這裡是我從零開始親手搭建的個人部落格。<br>
        記錄日常的心情點滴、旅行見聞，還有每一個小小的成長里程碑。
      </p>
    </section>

    <!-- 搜尋與分類篩選列 -->
    <section class="controls-section" id="posts-section" aria-label="文章篩選與搜尋">
      <div class="category-tabs" id="category-tabs" role="tablist" aria-label="文章分類">
        <button type="button" class="category-btn active" data-category="all" role="tab" aria-selected="true">全部隨筆</button>
        <button type="button" class="category-btn" data-category="心情日常" role="tab" aria-selected="false">心情日常</button>
        <button type="button" class="category-btn" data-category="學習筆記" role="tab" aria-selected="false">學習筆記</button>
        <button type="button" class="category-btn" data-category="生活靈感" role="tab" aria-selected="false">生活靈感</button>
      </div>

      <div class="search-box">
        <label for="search-input" class="visually-hidden">搜尋文章</label>
        <input type="search" id="search-input" placeholder="搜尋文章標題或關鍵字..." autocomplete="off">
      </div>
    </section>

    <!-- 文章列表區 -->
    <section class="posts-grid" id="posts-container" aria-live="polite">
      <!-- 由 JavaScript 自動讀取 posts.js 並生成卡片 -->
    </section>

    <!-- 單篇文章完整閱讀視圖 (預設隱藏，點擊文章後切換顯示) -->
    <article class="article-reader hidden" id="article-reader" aria-live="polite">
      <div class="reader-top-bar">
        <button type="button" id="back-to-list" class="btn-secondary">← 返回文章列表</button>
        <button type="button" id="copy-link-btn" class="btn-outline">🔗 複製文章連結</button>
      </div>
      <header class="article-header">
        <div class="article-meta">
          <span class="post-category" id="reader-category"></span>
          <time id="reader-date"></time>
          <span id="reader-readtime"></span>
        </div>
        <h1 class="article-title" id="reader-title"></h1>
      </header>
      <div class="article-body" id="reader-content"></div>
    </article>
  </main>

  <footer class="site-footer">
    <div class="container footer-inner">
      <p>© <span id="current-year">2026</span> 咻咻的心情隨筆 · 保留所有權利</p>
      <p class="footer-hint">💡 提示：想新增文章？只需在 <code>posts/</code> 資料夾新增 <code>.md</code> (Markdown) 檔案即可！</p>
    </div>
  </footer>

  <!-- Toast 通知訊息 -->
  <div id="toast" class="toast" role="status" aria-live="polite"></div>

  <script src="app.js"></script>
</body>
</html>
