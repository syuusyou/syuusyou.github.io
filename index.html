<!DOCTYPE html>
<html lang="zh-Hant">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <!-- MANDATORY: Declare support for both light and dark themes -->
  <meta name="color-scheme" content="light dark">
  <script>
    try {
      document.querySelector('meta[name="color-scheme"]').content = localStorage.getItem("color-scheme") ?? "light dark";
    } catch (e) {}
  </script>
  <title>咻咻的心情隨筆 | 記錄生活、靈感與學習的溫暖角落</title>
  <meta name="description" content="歡迎來到咻咻的心情隨筆。這裡記錄了我的日常感悟、生活隨筆與學習筆記。">
  
  <!-- 網站圖示與 RSS 訂閱源 -->
  <link rel="icon" type="image/svg+xml" href="favicon.svg">
  <link rel="alternate" type="application/rss+xml" title="咻咻的心情隨筆 RSS" href="rss.xml">

  <!-- Open Graph 社群分享標籤 -->
  <meta property="og:title" content="咻咻的心情隨筆">
  <meta property="og:description" content="記錄生活、靈感與學習點滴的個人部落格。">
  <meta property="og:type" content="website">
  <meta property="og:url" content="https://syuusyou.github.io/">

  <link rel="stylesheet" href="style.css">
</head>
<body>
  <!-- 頂部閱讀進度條 -->
  <div class="reading-progress" id="reading-progress" aria-hidden="true"></div>

  <header class="site-header">
    <div class="container header-inner">
      <a href="#" class="brand" id="home-link">
        <span class="brand-logo" aria-hidden="true">✦</span>
        <div>
          <span class="brand-title">咻咻的心情隨筆</span>
          <span class="brand-subtitle">HsiuHsiu's Notes &amp; Journal</span>
        </div>
      </a>

      <nav class="site-nav" aria-label="主要導覽">
        <a href="index.html" class="nav-link active" id="nav-posts" aria-current="page">所有文章</a>
        <a href="#archive" class="nav-link" id="nav-archive">年份歸檔</a>
        <a href="about.html" class="nav-link">關於咻咻</a>
        <a href="rss.xml" class="nav-link" target="_blank" rel="noopener" title="RSS 訂閱">RSS</a>
        <button type="button" id="theme-toggle" class="theme-toggle" aria-label="切換深淺色閱讀模式" title="切換深淺色主題">
          <span class="theme-icon-light" aria-hidden="true">☀️</span>
          <span class="theme-icon-dark" aria-hidden="true">🌙</span>
          <span class="theme-label">閱讀模式</span>
        </button>
      </nav>
    </div>
  </header>

  <main class="container main-content">
    <!-- 首頁主打區 (Hero Section) -->
    <section class="hero" id="hero-section">
      <div class="hero-badge">✨ 歡迎來到我的小天地</div>
      <h1 class="hero-title">把每個平凡的日子，<br>寫成值得回味的故事。</h1>
      <p class="hero-desc">
        嗨，我是咻咻！這裡是我從零開始親手搭建的個人部落格。<br>
        記錄日常的心情點滴、旅行見聞，還有每一個小小的成長里程碑。
      </p>
    </section>

    <!-- 搜尋與分類篩選列 -->
    <section class="controls-section" id="posts-section" aria-label="文章篩選與搜尋">
      <div class="category-tabs" id="category-tabs" role="tablist" aria-label="文章分類">
        <!-- 由 app.js 根據所有文章的 categories 動態生成 -->
      </div>

      <div class="search-box">
        <label for="search-input" class="visually-hidden">搜尋文章</label>
        <input type="search" id="search-input" placeholder="搜尋標題、分類或文章內文..." autocomplete="off">
      </div>
    </section>

    <!-- 文章列表區 (單欄垂直排列) -->
    <section class="posts-grid" id="posts-container" aria-live="polite">
      <!-- 由 JavaScript 自動讀取 posts/index.json 並生成卡片 -->
    </section>

    <!-- 年份歸檔時間軸視圖 (Archive View，預設隱藏) -->
    <section class="archive-section hidden" id="archive-section" aria-live="polite">
      <header class="archive-header">
        <h2>📅 文章年份歸檔</h2>
        <p class="archive-subtitle" id="archive-total-count"></p>
      </header>
      <div id="archive-container"></div>
    </section>

    <!-- 單篇文章完整閱讀視圖 (預設隱藏，點擊文章後切換顯示) -->
    <article class="article-reader hidden" id="article-reader" aria-live="polite">
      <div class="reader-top-bar">
        <button type="button" id="back-to-list" class="btn-secondary">← 返回文章列表</button>
        <button type="button" id="copy-link-btn" class="btn-outline">🔗 複製文章連結</button>
      </div>
      <header class="article-header">
        <div class="article-meta">
          <div class="post-categories" id="reader-categories"></div>
          <time id="reader-date"></time>
        </div>
        <h1 class="article-title" id="reader-title"></h1>
      </header>

      <!-- 自動生成的文章大綱目錄 (Table of Contents) -->
      <nav class="article-toc hidden" id="article-toc" aria-label="文章大綱目錄">
        <details open>
          <summary class="toc-title">📑 文章目錄</summary>
          <ul class="toc-list" id="toc-list"></ul>
        </details>
      </nav>

      <div class="article-body" id="reader-content"></div>

      <!-- 上一篇 / 下一篇 導覽卡片 -->
      <nav class="post-prev-next" id="post-prev-next" aria-label="上下篇文章導覽"></nav>

      <!-- Giscus 讀者留言區 (基於 GitHub Discussions) -->
      <section class="comments-section" id="comments-section" aria-label="讀者留言區">
        <h2 class="comments-heading">💬 讀者留言與交流</h2>
        <div id="giscus-container"></div>
      </section>
    </article>
  </main>

  <footer class="site-footer">
    <div class="container footer-inner">
      <p>© <span id="current-year">2026</span> 咻咻的心情隨筆 · 保留所有權利</p>
    </div>
  </footer>

  <!-- 右下角回到頂部浮動按鈕 -->
  <button type="button" id="back-to-top" class="back-to-top" aria-label="回到頁面頂部" title="回到頂部">↑</button>

  <!-- MANDATORY: 使用 closedby="any" 啟用原生 Light-dismiss 圖片放大燈箱 -->
  <dialog id="lightbox-dialog" class="lightbox-dialog" closedby="any" aria-label="圖片放大預覽">
    <form method="dialog" class="lightbox-inner">
      <img id="lightbox-img" src="" alt="">
      <p id="lightbox-caption" class="lightbox-caption"></p>
      <button type="submit" class="lightbox-close" aria-label="關閉圖片預覽">✕ 關閉</button>
    </form>
  </dialog>

  <!-- Toast 通知訊息 -->
  <div id="toast" class="toast" role="status" aria-live="polite"></div>

  <script src="app.js"></script>
</body>
</html>
